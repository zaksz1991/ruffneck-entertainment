<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Clear cache</title>
<style>body{font-family:system-ui;max-width:400px;margin:40px auto;padding:20px}button{width:100%;padding:16px;font-size:16px;background:#00B4D8;border:none;border-radius:10px;font-weight:700}</style>
</head><body>
<h1>Clear phone cache</h1>
<p>Tap once, wait for Done, then open Store.</p>
<button id="b">Clear now</button>
<p id="m"></p>
<p><a href="/store">Open Store</a></p>
<script>
document.getElementById('b').onclick=async function(){
  var m=document.getElementById('m'); m.textContent='Working...';
  try{
    if(navigator.serviceWorker){var r=await navigator.serviceWorker.getRegistrations();for(var i=0;i<r.length;i++)await r[i].unregister();}
    if(caches){var k=await caches.keys();for(var j=0;j<k.length;j++)await caches.delete(k[j]);}
    m.innerHTML='<b style="color:green">Done. Open Store.</b>';
  }catch(e){m.textContent=e.message;}
};
</script>
</body></html>
